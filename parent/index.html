<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F1E7">
<title>Think First · Family</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Think First">
<meta name="description" content="See your child's AI questions and Think First activity, with their agreement.">
<style>
:root{--ink:#1F1B16;--ink2:#5E574C;--ink3:#8A8275;--line:#DED6C6;--edge:#1F1B16;--bg:#F7F3EA;--card:#FBF8F1;--side:#EFE9DC;--lime:#CFDD3C;--good:#2E6B3A;--warn:#B4532A;--bad:#A3361F;--blue:#2A4F9E;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--disp:-apple-system,"SF Pro Display",BlinkMacSystemFont,system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
a{color:var(--ink);text-decoration-color:var(--lime);text-decoration-thickness:2px;text-underline-offset:3px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(247,243,234,.88);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1.5px solid var(--edge)}
.logo{display:flex;align-items:center;gap:10px;font:700 17px/1 var(--disp);letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.logo .lg{width:46px;display:block}.logo small{display:block;font:600 10px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.sp{flex:1}
.wrap{max-width:780px;margin:0 auto;padding:22px 18px 60px}
.btn{border:1.5px solid var(--edge);background:var(--card);border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:650;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.lime{background:var(--lime);color:#1F1B16}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
h1{font:700 34px/1.08 var(--disp);letter-spacing:-.035em;margin:0}
h2{font:700 20px/1.2 var(--disp);letter-spacing:-.02em;margin:0 0 10px}
.eyebrow,.day,.kpi .l,.lbl{font:700 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.sub{color:var(--ink3);font-size:13px}.muted{color:var(--ink3)}.small{font-size:13px}
.card{background:var(--card);border:1.5px solid var(--edge);border-radius:18px;padding:18px 20px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.field input{border:1.5px solid var(--edge);border-radius:12px;padding:13px 14px;background:var(--card);font-size:16px}
.field input:focus{outline:3px solid var(--lime);outline-offset:1px}
.login{max-width:440px;margin:5vh auto;text-align:center}
.nd{display:block}.login .nd{width:150px;margin:0 auto}
.login h1{font-size:40px;margin-top:6px}
.ttl{margin:4px 0 18px}.ttl h1{font-size:clamp(34px,6vw,46px);margin-top:6px}
.demo{display:flex;align-items:center;gap:12px;background:var(--lime);border:1.5px solid var(--edge);border-radius:16px;padding:14px 16px;margin-bottom:14px;color:#1F1B16}
.demo b{display:block}.demo span{font-size:13px;opacity:.8}.demo .btn{margin-left:auto;white-space:nowrap;flex:none;background:#1F1B16;color:#F7F3EA;border-color:#1F1B16}
.kids{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px}
.kid{flex:none;border:1.5px solid var(--edge);background:var(--card);border-radius:999px;padding:8px 15px;font-weight:650;cursor:pointer;display:flex;align-items:center;gap:8px}
.kid[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.kid .st{width:8px;height:8px;border-radius:50%;background:#B9AF9C}.kid .st.on{background:#5FB36F}
.status{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:18px;border:1.5px solid var(--edge);background:var(--card);margin-bottom:16px}
.status .tx{flex:1;min-width:0}
.status .lb{display:flex;align-items:center;gap:7px;font:700 11px var(--mono);letter-spacing:.14em;color:var(--ink3)}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--ink3)}
.status.on .lb{color:var(--good)}.status.on .dot{background:var(--good)}.status.warn .lb{color:var(--warn)}.status.warn .dot{background:var(--warn)}
.status b{display:block;font:700 22px/1.2 var(--disp);letter-spacing:-.02em;margin:6px 0 3px}.status span.d{font-size:14px;color:var(--ink2)}
.status .nd{width:110px;flex:none}
@media (max-width:480px){.status .nd{width:84px}.status b{font-size:19px}}
.tabs{display:flex;gap:6px;background:var(--side);border:1.5px solid var(--edge);border-radius:999px;padding:5px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:9px;cursor:pointer;font-size:14px;font-weight:650;color:var(--ink2)}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.dhead{display:flex;align-items:center;gap:8px;margin:2px 0 10px}.dhead .sp{flex:1}
.arr{width:34px;height:30px;border-radius:999px;border:1.3px solid var(--edge);background:none;cursor:pointer;font-weight:700}
.arr:disabled{border-color:var(--line);color:var(--line);cursor:default}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 6px;margin-bottom:14px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.dchip{flex:none;width:58px;border:1.3px solid var(--line);background:var(--card);border-radius:13px;padding:8px 0 7px;text-align:center;cursor:pointer;color:var(--ink)}
.dchip small{display:block;font:700 10px var(--mono);letter-spacing:.06em;color:var(--ink2)}
.dchip b{display:block;font:600 21px/1.25 var(--disp)}
.dchip i{display:inline-block;min-width:20px;height:16px;line-height:16px;border-radius:99px;font:700 10px var(--mono);font-style:normal}
.dchip i.n{background:var(--lime);color:#1F1B16;padding:0 5px}.dchip i.dt{width:5px;min-width:0;height:5px;background:var(--ink3);vertical-align:middle}
.dchip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}.dchip[aria-pressed=true] small{color:var(--bg)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1.5px solid var(--edge);border-radius:16px;padding:13px 14px}
.kpi .v{font:700 32px/1.1 var(--disp);letter-spacing:-.04em;margin-top:8px}
.kpi .v.hl span{background:linear-gradient(transparent 62%,var(--lime) 62%,var(--lime) 92%,transparent 92%)}
.kpi .u{font-size:12px;color:var(--ink3)}
.feed{background:var(--card);border:1.5px solid var(--edge);border-radius:18px;padding:2px 18px}
.ev{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex:none;border:1.2px solid var(--line);background:var(--bg)}
.ev .ic.q{border-color:#9FB2DA;background:#EEF2FA}.ev .ic.w{border-color:#E2B59A;background:#FBEFE7}.ev .ic.b{border-color:#E0A79B;background:#FBEDEA}.ev .ic.g{border-color:#A9CDB0;background:#EDF6EF}
.ev .bd{min-width:0;flex:1}
.ev .q{font-size:16px;overflow-wrap:anywhere}
.ev .q.qq{font:500 17px/1.45 var(--sans)}
.ev .mt{font:12px var(--mono);color:var(--ink3);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:3px 7px;border-radius:6px;font:700 10.5px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;border:1.2px solid var(--line);color:var(--ink2)}
.p-good{background:var(--lime);border-color:#1F1B16;color:#1F1B16}.p-skip{border-color:var(--warn);color:var(--warn)}.p-none{}
.locked{color:var(--ink3);font-style:italic}
.close{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:8px 0 2px;font-size:13px;color:var(--ink2)}
.ev .close i{width:11px;height:11px;border-radius:50%;border:1.3px solid #B9AF9C;background:transparent;display:inline-block;flex:none}
.ev .close i.on{background:var(--lime);border-color:#1F1B16}.close span{margin-left:6px}.close b{color:var(--ink)}
.back{margin-top:14px}
.code{font:700 22px/1.3 var(--mono);letter-spacing:.08em;background:var(--lime);color:#1F1B16;border:1.5px solid var(--edge);border-radius:14px;padding:16px;text-align:center;margin:10px 0;word-break:break-all}
.code small{display:block;font:700 11px var(--mono);letter-spacing:.14em;color:#5E574C;margin-bottom:4px}
.steps{margin:0;padding-left:20px}.steps li{margin:7px 0}
.agree{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:14px;margin:12px 0;background:var(--card);border:1.5px solid var(--edge);border-radius:12px;padding:12px}
.agree input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:#1F1B16}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.set{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.set:last-child{border-bottom:0}
.set .t{flex:1}.set .t b{display:block}.set .t span{font-size:13px;color:var(--ink3)}
.sw{position:relative;width:48px;height:29px;flex:none}.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:999px;background:#D8D0BF;transition:.2s;cursor:pointer}
.sw i::after{content:'';position:absolute;left:3px;top:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--good)}.sw input:checked+i::after{transform:translateX(19px)}
.notice{border:1.5px solid var(--edge);background:var(--lime);border-radius:12px;padding:12px 14px;font-size:14px;margin:0 0 14px;color:#1F1B16}
.empty{text-align:center;color:var(--ink2);padding:26px 8px}
.empty .nd{width:110px;margin:0 auto 8px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:11px 18px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw}
.privacy{font-size:12.5px;color:var(--ink3);margin-top:22px;line-height:1.6}
.dog.sit{transform:none}
</style>
</head>
<body>
<div class="top"><a class="logo" href="/families.html"><span class="lg" id="lg"></span><div>Think First<small>Family</small></div></a><div class="sp"></div><span class="sub" id="who"></span><button class="btn ghost sm" id="signOut" hidden>Sign out</button></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script src="../teacher/config.js"></script>
<script src="../teacher/noodle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  // Think First for Families: the parent's page. Questions arrive encrypted; this page decrypts them with
  // the secret half of the pairing code, which stays in this browser and is never sent to the server.
  const C = window.TF_SCHOOL || {};
  const DEMO = new URLSearchParams(location.search).has('demo') || !(C.url && C.anonKey);
  const sb = !DEMO && window.supabase ? window.supabase.createClient(C.url, C.anonKey) : null;
  const DOWNLOAD = 'https://github.com/ThinkFirstNoodle/think-first/releases/download/family-v0.1.1/Think-First-for-Families-0.1.1.dmg';
  const ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const toast = (t) => { const e = $('toast'); e.textContent = t; e.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(() => (e.style.opacity = 0), 2400); };
  const noodle = (mood = 'proud', cls = '') => `<div class="dog nd ${mood} ${cls}">${TF.dogSVG(mood, 'Noodle', {})}</div>`;
  const ago = (ts) => { if (!ts) return 'never'; const m = (Date.now() - ts) / 6e4; return m < 2 ? 'just now' : m < 60 ? `${Math.round(m)} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
  const hm = (ts) => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const dayName = (ts) => { const d = new Date(ts), t = new Date(); const y = new Date(Date.now() - 864e5); return d.toDateString() === t.toDateString() ? 'Today' : d.toDateString() === y.toDateString() ? 'Yesterday' : d.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' }); };
  const lc = (d) => (d === 'Today' || d === 'Yesterday' ? d.toLowerCase() : 'on ' + d);
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };

  /* ---------- the key (same as src/main/family.js in the app) ---------- */
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function deriveKey(secret, famId) {
    const base = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: enc.encode(`thinkfirst-family:${famId}`), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function seal(key, text) { const iv = crypto.getRandomValues(new Uint8Array(12)); return `${b64(iv)}.${b64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text)))}`; }
  async function open(key, box) { const [iv, body] = String(box || '').split('.'); return dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, key, unb64(body))); }
  const randomSecret = () => Array.from(crypto.getRandomValues(new Uint32Array(12)), (n) => ALPHABET[n % ALPHABET.length]).join('');
  const pretty = (code, secret) => `${code}-${secret.slice(0, 4)}-${secret.slice(4, 8)}-${secret.slice(8)}`;
  const secretKey = (id) => `tf-family-secret:${id}`;

  /* ---------- state ---------- */
  let me = null, fam = null, kids = [], events = [], key = null, kidSel = null, tab = 'activity';
  const app = $('app');

  async function loadFamily() {
    const f = await sb.from('families').select('*').order('created_at').limit(1);
    fam = (f.data || [])[0] || null;
    if (!fam) return;
    const secret = store.get(secretKey(fam.id));
    key = null;
    if (secret) { try { const k = await deriveKey(secret, fam.id); if ((await open(k, fam.check_box)) === 'thinkfirst') key = k; } catch {} }
    const k = await sb.from('family_children').select('*').eq('family_id', fam.id).order('joined_at');
    kids = k.data || [];
    const e = await sb.from('family_events').select('*').eq('family_id', fam.id).order('ts', { ascending: false }).limit(500);
    events = e.data || [];
    await Promise.all(events.map(async (ev) => { ev.text = null; if (ev.secret && key) { try { ev.text = await open(key, ev.secret); } catch { ev.text = null; } } }));
    if (kidSel && !kids.some((c) => c.child_id === kidSel)) kidSel = null;
  }

  /* ---------- screens ---------- */
  function screenLogin(msg) {
    app.innerHTML = `<div class="login card" style="padding:26px">${noodle('proud', 'sit')}<h1>Family sign-in</h1><p class="sub" style="font-size:15px;margin:6px 0 18px">See your child's AI questions and how they use Think First, with their agreement. Works on your phone too.</p>
      <button class="btn wide" id="google" style="margin-bottom:12px"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</button>
      <div style="display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:12px;margin:0 0 12px"><span style="flex:1;height:1px;background:var(--line)"></span>or<span style="flex:1;height:1px;background:var(--line)"></span></div>
      <div class="field" style="text-align:left"><label for="em">Email</label><input id="em" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <button class="btn pri wide" id="send">Email me a sign-in link</button>${msg ? `<p class="small" style="margin-top:12px">${esc(msg)}</p>` : ''}
      <p class="privacy">Your child's questions are encrypted on their Mac with a code only you two have, so not even Think First can read them. <a href="?demo">See a sample →</a> · <a href="/families.html">What’s Think First for Families?</a></p></div>`;
    const back = location.href.split('#')[0].split('?')[0];
    $('google').onclick = async () => { const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: back, queryParams: { prompt: 'select_account' } } }); if (error) screenLogin(error.message); };
    $('send').onclick = async () => { const em = $('em').value.trim(); if (!em) return; const { error } = await sb.auth.signInWithOtp({ email: em, options: { emailRedirectTo: back } }); screenLogin(error ? error.message : `Check ${em} for the sign-in link.`); };
  }

  function screenProfile(name, email) {
    app.innerHTML = `<div class="login card" style="padding:26px;text-align:left">${noodle('proud', 'happy')}<h1 style="text-align:center">Welcome!</h1><p class="sub" style="font-size:15px;margin:6px 0 16px;text-align:center">This is the name your child sees when they pair.</p>
      <div class="field"><label for="pn">Your name</label><input id="pn" placeholder="Mum, Dad, or your name" value="${esc(name)}"></div>
      <button class="btn pri wide" id="save">Continue</button></div>`;
    $('save').onclick = async () => { const n = $('pn').value.trim(); if (!n) return; const { error } = await sb.from('parents').insert({ name: n, email }); if (error) return toast(error.message); boot(); };
  }

  function screenCreate() {
    app.innerHTML = `<div class="card" style="margin-top:8px">${noodle('neutral', 'sit carry-ball')}<h1 style="text-align:center;margin-top:-4px">Set up your family</h1>
      <p class="sub" style="font-size:15px;text-align:center;margin:6px 0 16px">You'll get a pairing code to type into Think First for Families on your child's Mac.</p>
      <h2>What you'll see</h2>
      <ul class="steps small"><li>Every question they ask an AI, word for word</li><li>Whether they tried first or skipped, the subject and which AI</li><li>How close their attempt got to the answer: how many key points they got and missed (numbers only)</li><li>When Think First is paused, quit, stops unexpectedly or loses Screen Recording, with an email to you</li></ul>
      <h2 style="margin-top:14px">What you won't see</h2>
      <ul class="steps small"><li>Their attempts, the AI's answers, or anything else on their Mac</li></ul>
      <label class="agree"><input type="checkbox" id="ok"><span>I'll talk to my child about this first. Nothing is shared until they read the same list on their Mac and agree, and they can see everything I see.</span></label>
      <div class="field"><label for="fn">Family name</label><input id="fn" placeholder="The Kims" maxlength="60"></div>
      <button class="btn pri wide" id="mk">Create pairing code</button></div>`;
    $('mk').onclick = async () => {
      if (!$('ok').checked) return toast('Tick the box first.');
      const name = $('fn').value.trim() || 'Family';
      const id = crypto.randomUUID(), secret = randomSecret();
      const k = await deriveKey(secret, id);
      const { error } = await sb.rpc('create_family', { fam: id, family_name: name, check_box: await seal(k, 'thinkfirst') });
      if (error) return toast(error.message);
      store.set(secretKey(id), secret);
      await loadFamily(); tab = 'pair'; screenMain();
    };
  }

  function screenUnlock() {
    return `<div class="card"><h2>Read questions on this device</h2><p class="small muted">Questions are locked with your pairing code, which is kept only on the device that made it. Type it here once to unlock them on this ${/Mobi/.test(navigator.userAgent) ? 'phone' : 'browser'}.</p>
      <div class="field"><input id="uc" placeholder="${esc(fam.code)}-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" style="font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase"></div>
      <button class="btn pri wide" id="ub">Unlock</button></div>`;
  }

  function pairCard() {
    const secret = store.get(secretKey(fam.id));
    return `<div class="card"><h2>Pair your child's Mac</h2>
      <ol class="steps small"><li>On their Mac, download <a href="${DOWNLOAD}">Think First for Families</a> and open it.</li><li>Go to <b>Family</b> in the sidebar and type this code.</li><li>They read what's shared and agree. That's it.</li></ol>
      ${secret ? `<div class="code"><small>PAIRING CODE</small>${esc(pretty(fam.code, secret))}</div>
        <div class="row"><button class="btn sm" id="copy">Copy code</button><span class="small muted">Keep it private: it's also the key to read their questions. Type it on your phone to read them there too.</span></div>`
        : '<p class="small muted">This code was made on another device. Open this page there to see it, or unlock below.</p>'}</div>`;
  }

  // Install as an app on the parent's phone (a home-screen app; no App Store needed).
  let installEvt = null;
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; if (fam) screenMain(); });
  const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  function installCard() {
    if (standalone()) return '';
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const android = /Android/.test(navigator.userAgent);
    const how = installEvt ? '<button class="btn pri wide" id="install">Install the app</button>'
      : ios ? '<ol class="steps small"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (the square with an arrow).</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>'
      : android ? '<ol class="steps small"><li>Open this page in <b>Chrome</b>.</li><li>Tap <b>⋮</b> at the top right.</li><li>Tap <b>Install app</b> (or <b>Add to Home screen</b>).</li></ol>'
      : '<p class="small muted">On your phone, open <b>trythinkfirst.com/parent</b>, sign in, and add it to your home screen. In Chrome or Edge on a computer, use the install button in the address bar.</p>';
    return `<div class="card"><h2>📱 Get the app on your phone</h2><p class="small muted" style="margin-top:-4px">It opens full-screen from your home screen, like any app. Sign in once, then type your pairing code once to read questions there.</p>${how}</div>`;
  }

  function evIcon(ev) {
    return { question: ['❓', 'q'], pause: ['⏸️', 'w'], resume: ['▶️', 'g'], quit: ['⏹️', 'w'], start: ['🟢', 'g'], unclean_stop: ['⚠️', 'b'], perms_off: ['🚫', 'b'], perms_on: ['✅', 'g'], joined: ['🤝', 'g'], sharing_off: ['✋', 'b'] }[ev.kind] || ['•', ''];
  }
  function evText(ev) {
    const who = (kids.find((c) => c.child_id === ev.child_id) || {}).display_name || 'Your child';
    switch (ev.kind) {
      case 'question': return ev.text != null ? `<div class="q">${esc(ev.text)}</div>` : `<div class="q locked">${key ? 'Couldn’t unlock this question' : 'Locked question. Unlock below to read it'}</div>`;
      case 'pause': return `<div class="q">${esc(who)} paused Think First</div>`;
      case 'resume': return `<div class="q">${esc(who)} turned Think First back on</div>`;
      case 'quit': return `<div class="q">${esc(who)} quit Think First</div>`;
      case 'start': return `<div class="q">Think First opened</div>`;
      case 'unclean_stop': return `<div class="q">Think First stopped without quitting</div><div class="mt">Force quit, a crash or a flat battery. Last seen ${ev.since ? `${lc(dayName(Date.parse(ev.since)))} ${hm(Date.parse(ev.since))}` : 'earlier'}</div>`;
      case 'perms_off': return `<div class="q">Screen Recording was turned off, so Think First can't see questions</div>`;
      case 'perms_on': return `<div class="q">Screen Recording was turned back on</div>`;
      case 'joined': return `<div class="q">${esc(who)} agreed and started sharing</div>`;
      case 'sharing_off': return `<div class="q">${esc(who)} stopped sharing</div>`;
    }
    return esc(ev.kind);
  }
  function feed(list, isToday) {
    if (!list.length) return `<div class="card empty">${noodle('neutral', 'sit')}${isToday ? 'Nothing yet today. Questions and activity show up here as they happen.' : 'Nothing on this day.'}</div>`;
    let out = '<div class="feed">';
    for (const ev of list.slice(0, 300)) {
      const ts = Date.parse(ev.ts);
      const [ic, cl] = evIcon(ev);
      const meta = ev.kind === 'question' ? `<span class="pill ${ev.tried ? 'p-good' : 'p-skip'}">${ev.tried ? 'Tried first' : 'Skipped'}</span>${ev.tried && ev.effort ? `<span class="pill">${ev.effort} words</span>` : ''}${ev.subject && ev.subject !== 'Other' ? `<span class="pill">${esc(ev.subject)}</span>` : ''}` : '';
      const close = ev.kind === 'question' && ev.got != null && (ev.got + (ev.missed || 0)) > 0 ? `<div class="close" title="How close their attempt was to the AI's answer">${'<i class="on"></i>'.repeat(Math.min(ev.got, 10))}${'<i></i>'.repeat(Math.min(ev.missed || 0, Math.max(0, 10 - ev.got)))}<span>Got <b>${ev.got} of ${ev.got + (ev.missed || 0)}</b> key points${ev.only_you ? ` · ${ev.only_you} idea${ev.only_you === 1 ? '' : 's'} of their own` : ''}</span></div>` : '';
      const who = kids.length > 1 ? ` · ${esc((kids.find((c) => c.child_id === ev.child_id) || {}).display_name || '')}` : '';
      out += `<div class="ev"><div class="ic ${cl}">${ic}</div><div class="bd">${evText(ev)}<div class="mt">${hm(ts)}${ev.kind === 'question' && ev.ai ? ` · ${esc(ev.ai)}${ev.surface === 'browser' ? ' (website)' : ''}` : ''}${who}</div>${close}${meta ? `<div class="mt" style="margin-top:8px">${meta}</div>` : ''}</div></div>`;
    }
    return out + '</div>';
  }

  // Day navigation: today by default; chips for the last days with anything.
  let daySel = null; // start-of-day ms, null = today
  const sod = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  function dayList(mine) {
    const today = sod(Date.now()), counts = {};
    for (const e of mine) { const k = sod(Date.parse(e.ts)); counts[k] = counts[k] || { q: 0, any: true }; if (e.kind === 'question') counts[k].q++; }
    const oldest = Math.min(today, ...Object.keys(counts).map(Number));
    const span = Math.min(29, Math.max(6, Math.round((today - oldest) / 864e5)));
    const out = []; for (let i = span; i >= 0; i--) { const d = sod(today - i * 864e5 + 3600e3 * 3); out.push({ d, q: (counts[d] || {}).q || 0, any: !!counts[d] }); }
    return out;
  }
  function dayStrip(days, sel) {
    const today = sod(Date.now()), yest = sod(today - 864e5 + 3600e3 * 3);
    const name = (d) => d === today ? 'Today' : d === yest ? 'Yesterday' : new Date(d).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    const top = (d) => d === today ? 'TODAY' : d === yest ? 'YEST.' : new Date(d).toLocaleDateString([], { weekday: 'short' }).toUpperCase();
    const first = days[0].d;
    return `<div class="dhead"><span class="eyebrow">${esc(name(sel))}</span><span class="sp"></span><button class="arr" data-move="-1" ${sel <= first ? 'disabled' : ''} aria-label="Earlier day">‹</button><button class="arr" data-move="1" ${sel >= today ? 'disabled' : ''} aria-label="Later day">›</button></div>
      <div class="strip" id="strip">${days.map((x) => `<button class="dchip" data-day="${x.d}" aria-pressed="${x.d === sel}"><small>${top(x.d)}</small><b>${new Date(x.d).getDate()}</b>${x.q ? `<i class="n">${x.q}</i>` : x.any ? '<i class="dt"></i>' : '<i></i>'}</button>`).join('')}</div>`;
  }

  function screenMain() {
    const mine = events.filter((e) => !kidSel || e.child_id === kidSel);
    const today = sod(Date.now()), sel = daySel == null ? today : daySel, isToday = sel === today;
    const day = mine.filter((e) => sod(Date.parse(e.ts)) === sel);
    const qs = day.filter((e) => e.kind === 'question'), tried = qs.filter((e) => e.tried).length;
    const close = qs.filter((e) => e.got != null && (e.got + (e.missed || 0)) > 0);
    const closeP = close.length ? Math.round(100 * close.reduce((a, e) => a + e.got, 0) / close.reduce((a, e) => a + e.got + (e.missed || 0), 0)) : null;
    const stops = day.filter((e) => ['pause', 'quit', 'unclean_stop', 'perms_off'].includes(e.kind)).length;
    const kid = kids.find((c) => c.child_id === kidSel) || kids[0];
    const seen = kid && kid.last_seen ? Date.parse(kid.last_seen) : 0;
    const lastEv = mine.find((e) => ['pause', 'resume', 'quit', 'start', 'unclean_stop', 'perms_off', 'perms_on', 'sharing_off'].includes(e.kind));
    const status = (tone, label, title, detail, mood) => `<div class="status ${tone}"><div class="tx"><div class="lb"><span class="dot"></span>${label}</div><b>${title}</b><span class="d">${detail}</span></div>${noodle(mood)}</div>`;
    let st;
    if (!kids.length) st = status('', 'WAITING', 'Waiting for your child to pair', 'Give them the pairing code in the Pair tab.', 'neutral');
    else if (kid.left_at) st = status('warn', 'HEADS UP', `${esc(kid.display_name)} stopped sharing`, `${dayName(Date.parse(kid.left_at))} ${hm(Date.parse(kid.left_at))}`, 'mope');
    else if (lastEv && ['pause', 'quit', 'unclean_stop', 'perms_off'].includes(lastEv.kind)) st = status('warn', 'HEADS UP', { pause: 'Paused', quit: 'Quit', unclean_stop: 'Stopped unexpectedly', perms_off: 'Can’t see the screen' }[lastEv.kind], `Since ${lc(dayName(Date.parse(lastEv.ts)))} ${hm(Date.parse(lastEv.ts))} · last seen ${ago(seen)}`, 'mope');
    else if (Date.now() - seen < 15 * 6e4) st = status('on', 'ON', `${esc(kid.display_name)}’s Think First is on`, `Last seen ${ago(seen)}`, 'proud');
    else st = status('', 'QUIET', `${esc(kid.display_name)}’s Mac hasn’t checked in lately`, `Last seen ${ago(seen)}. It may be asleep or off.`, 'neutral');
    const kpi = (l, v, u, hl) => `<div class="kpi"><div class="l">${l}</div><div class="v ${hl ? 'hl' : ''}"><span>${v}</span></div><div class="u">${u}</div></div>`;

    app.innerHTML = `<div class="ttl"><span class="eyebrow">Think First Family</span><h1>${esc(fam.name)}</h1></div>
      ${DEMO ? '<div class="demo"><div><b>Sample data</b><span>A made-up child, so you can see how it works.</span></div><a class="btn sm" href="./">Sign in</a></div>' : ''}
      ${kids.length > 1 ? `<div class="kids"><button class="kid" data-kid="" aria-pressed="${!kidSel}">Everyone</button>${kids.map((c) => `<button class="kid" data-kid="${c.child_id}" aria-pressed="${kidSel === c.child_id}"><span class="st ${c.left_at ? '' : 'on'}"></span>${esc(c.display_name)}</button>`).join('')}</div>` : ''}
      ${st}
      <div class="tabs"><button data-tab="activity" aria-pressed="${tab === 'activity'}">Activity</button><button data-tab="pair" aria-pressed="${tab === 'pair'}">Pair</button><button data-tab="settings" aria-pressed="${tab === 'settings'}">Settings</button></div>
      ${tab === 'activity' ? `${dayStrip(dayList(mine), sel)}
        <div class="kpis">${kpi(isToday ? 'Today' : 'Questions', qs.length, qs.length === 1 ? 'question asked' : 'questions asked')}${kpi('Tried first', qs.length ? Math.round((100 * tried) / qs.length) + '%' : '–', 'before asking AI', qs.length > 0)}${kpi('How close', closeP == null ? '–' : closeP + '%', closeP == null ? 'when they try first' : 'of the key points')}${kpi('Paused', stops, (stops === 1 ? 'time' : 'times') + (isToday ? ' today' : ' that day'))}</div>
        ${!key && !DEMO && day.some((e) => e.kind === 'question') ? screenUnlock() : ''}${feed(day, isToday)}
        ${!isToday ? '<button class="btn wide back" data-day="today">Back to today</button>' : ''}` : ''}
      ${tab === 'pair' ? pairCard() + (!key && !DEMO ? screenUnlock() : '') + installCard() : ''}
      ${tab === 'settings' ? `<div class="card"><h2>${esc(fam.name)}</h2>
          <div class="set"><div class="t"><b>Email me</b><span>When Think First is paused, quit, stops unexpectedly, loses Screen Recording, or sharing stops. At most one per type every 30 minutes. Never includes questions.${me && me.email ? ` Sent to ${esc(me.email)}.` : ''}</span></div><label class="sw"><input type="checkbox" id="alerts" ${fam.alerts ? 'checked' : ''}><i></i></label></div>
          ${kids.map((c) => `<div class="set"><div class="t"><b>${esc(c.display_name)}</b><span>Paired ${lc(dayName(Date.parse(c.joined_at)))}${c.left_at ? ' · stopped sharing' : ''}</span></div><button class="btn sm danger" data-remove="${c.child_id}">Remove</button></div>`).join('')}
        </div>
        <div class="card"><h2>Delete</h2><p class="small muted">Deletes the family, the pairing code and everything shared. Your child's app stops sharing. This can't be undone.</p><button class="btn danger wide" id="delFam">Delete family and all history</button></div>
        <p class="privacy">Questions are encrypted on your child's Mac with the secret part of the pairing code. Our server only stores scrambled text and never receives the code, so only your devices and their Mac can read them. <a href="/privacy.html">Privacy</a> · <a href="mailto:hello@trythinkfirst.com">hello@trythinkfirst.com</a></p>` : ''}`;
    wire();
    const strip = document.getElementById('strip'), on = strip && strip.querySelector('[aria-pressed=true]');
    if (on) strip.scrollLeft = on.offsetLeft - strip.clientWidth + on.offsetWidth + 8;
  }

  function wire() {
    app.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { tab = b.dataset.tab; screenMain(); }));
    app.querySelectorAll('[data-kid]').forEach((b) => (b.onclick = () => { kidSel = b.dataset.kid || null; screenMain(); }));
    app.querySelectorAll('[data-day]').forEach((b) => (b.onclick = () => { const d = b.dataset.day === 'today' ? null : Number(b.dataset.day); daySel = d === sod(Date.now()) ? null : d; screenMain(); }));
    app.querySelectorAll('[data-move]').forEach((b) => (b.onclick = () => { const cur = daySel == null ? sod(Date.now()) : daySel; const d = sod(cur + Number(b.dataset.move) * 864e5 + 3600e3 * 3); daySel = d >= sod(Date.now()) ? null : d; screenMain(); }));
    if ($('install')) $('install').onclick = async () => { installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; screenMain(); };
    if ($('copy')) $('copy').onclick = () => { navigator.clipboard.writeText(pretty(fam.code, store.get(secretKey(fam.id)))).then(() => toast('Copied')); };
    if ($('ub')) $('ub').onclick = async () => {
      const s = $('uc').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (s.length !== 18 || s.slice(0, 6) !== fam.code) return toast('That isn’t this family’s code.');
      try { const k = await deriveKey(s.slice(6), fam.id); if ((await open(k, fam.check_box)) !== 'thinkfirst') throw 0; store.set(secretKey(fam.id), s.slice(6)); toast('Unlocked on this device'); await loadFamily(); screenMain(); }
      catch { toast('That code doesn’t match. Check it letter by letter.'); }
    };
    if (DEMO) return;
    if ($('alerts')) $('alerts').onchange = async (e) => { const { error } = await sb.from('families').update({ alerts: e.target.checked }).eq('id', fam.id); if (error) return toast(error.message); fam.alerts = e.target.checked; toast(e.target.checked ? 'Emails on' : 'Emails off'); };
    app.querySelectorAll('[data-remove]').forEach((b) => (b.onclick = async () => {
      if (!confirm('Remove this Mac from your family? Its app stops sharing. History stays until you delete the family.')) return;
      const { error } = await sb.from('family_children').delete().eq('family_id', fam.id).eq('child_id', b.dataset.remove); if (error) return toast(error.message);
      await loadFamily(); screenMain();
    }));
    if ($('delFam')) $('delFam').onclick = async () => {
      if (prompt(`Type the family name (${fam.name}) to delete everything.`) !== fam.name) return;
      const { error } = await sb.from('families').delete().eq('id', fam.id); if (error) return toast(error.message);
      store.del(secretKey(fam.id)); fam = null; screenCreate();
    };
  }

  /* ---------- sample data (?demo) ---------- */
  function demo() {
    const now = Date.now(), m = 6e4, kid = 'demo-kid';
    kids = [{ child_id: kid, display_name: 'Mina', joined_at: new Date(now - 6 * 864e5).toISOString(), last_seen: new Date(now - 3 * m).toISOString() }];
    fam = { id: 'demo', name: 'The Kims', code: 'K7Q2MD', alerts: true };
    key = 'demo';
    const q = (min, text, tried, subject, ai, effort) => ({ child_id: kid, ts: new Date(now - min * m).toISOString(), kind: 'question', tried, subject, ai, surface: 'app', effort, text, ...(tried ? { got: 2 + (min % 3), missed: 1 + (min % 2), only_you: min % 2 } : {}) });
    const e = (min, kind, extra = {}) => ({ child_id: kid, ts: new Date(now - min * m).toISOString(), kind, ...extra });
    events = [
      q(4, 'Why does the moon look bigger near the horizon?', true, 'Physics', 'ChatGPT', 23),
      q(19, 'Summarise the causes of the First World War in 5 points', false, 'History', 'ChatGPT', 0),
      e(31, 'resume'), e(52, 'pause'),
      q(70, 'How do I factorise x² + 5x + 6?', true, 'Maths', 'Claude', 11),
      e(76, 'start'), e(77, 'unclean_stop', { since: new Date(now - 130 * m).toISOString() }),
      q(140, '영어 에세이 서론 어떻게 시작하면 좋을까?', true, 'English', 'Gemini', 31),
      e(24 * 60 + 10, 'quit'),
      q(24 * 60 + 40, 'What is the difference between mitosis and meiosis?', true, 'Biology', 'ChatGPT', 42),
      q(24 * 60 + 55, 'Write my conclusion for the photosynthesis lab report', false, 'Biology', 'ChatGPT', 0),
      q(2 * 1440 + 30, 'Is a virus alive? I think no because it can’t reproduce by itself.', true, 'Biology', 'Claude', 27),
      e(2 * 1440 + 90, 'start'),
      q(3 * 1440 + 15, 'Does my thesis about Macbeth’s guilt make sense or is it too obvious?', true, 'English', 'Gemini', 51),
      q(3 * 1440 + 50, 'solve 2x² − 8 = 0', false, 'Maths', 'ChatGPT', 0),
      q(5 * 1440 + 20, 'Why did the Roman Empire split in two?', true, 'History', 'ChatGPT', 38),
      e(6 * 1440, 'joined'),
    ];
    me = { email: 'parent@example.com' };
    store.set(secretKey('demo'), 'X9TP4WRN8HJA');
  }

  $('lg').innerHTML = TF.dogSVG('proud', 'Noodle', {});
  async function boot() {
    if (DEMO) { demo(); $('who').textContent = 'Sample'; return screenMain(); }
    const { data: { session } } = await sb.auth.getSession();
    if (!session || session.user.is_anonymous) return screenLogin();
    $('who').textContent = session.user.email || ''; $('signOut').hidden = false;
    const p = await sb.from('parents').select('*').eq('id', session.user.id).maybeSingle();
    const md = session.user.user_metadata || {};
    if (!p.data) return screenProfile(md.full_name || md.name || '', session.user.email || null);
    me = p.data;
    if (!me.email && session.user.email) { await sb.from('parents').update({ email: session.user.email }).eq('id', me.id); me.email = session.user.email; }
    await loadFamily();
    if (!fam) return screenCreate();
    if (!kids.length) tab = 'pair';
    screenMain();
    clearInterval(boot.t);
    boot.t = setInterval(async () => { if (document.hidden || tab !== 'activity' || (document.activeElement && document.activeElement.id === 'uc')) return; await loadFamily().catch(() => {}); if (fam) screenMain(); }, 30000);
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  $('signOut').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  if (sb) sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN') boot(); });
  boot().catch((e) => { app.innerHTML = `<div class="card"><h2>Something went wrong</h2><p class="muted">${esc(e.message)}</p></div>`; });
})();
</script>
</body>
</html>
